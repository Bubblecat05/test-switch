<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Labo Étape 3 : Alignement Mémoire</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; font-size: 16px; }
        h1 { color: #fff; border-bottom: 1px solid #00ffff; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>[+] Labo Étape 3 : Test d'alignement des structures</h1>
    <p>Recherche d'incohérences dans la gestion des TypedArrays...</p>
    <hr>
    <div id="console"></div>

    <script>
        function log(msg) {
            document.getElementById('console').innerHTML += msg + "<br>";
        }

        try {
            log("[...] Initialisation des structures mémoires alignées...");
            
            // Correction de la variable (sans espace)
            var buffer_brut = new ArrayBuffer(64);
            var vue32 = new Uint32Array(buffer_brut);
            var vue8 = new Uint8Array(buffer_brut);
            
            // Injection de la valeur test
            vue32[0] = 0xDEADBEEF;
            
            log("[✓] Structures initialisées.");
            log("[...] Lecture brute des octets alignés :");
            
            // Lecture des 4 premiers octets de l'objet
            log("Octet 0 : 0x" + vue8[0].toString(16).toUpperCase());
            log("Octet 1 : 0x" + vue8[1].toString(16).toUpperCase());
            log("Octet 2 : 0x" + vue8[2].toString(16).toUpperCase());
            log("Octet 3 : 0x" + vue8[3].toString(16).toUpperCase());
            
            log("<br><span style='color:#00ffff;'>[✓] Test réussi. Analyse de la structure ARM64 complétée.</span>");
        } catch(e) {
            log("<span style='color:red;'>[X] Erreur : " + e.message + "</span>");
        }
    </script>
</body>
</html>
