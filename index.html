<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Labo Kernel OLED</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; font-size: 16px; }
        h1 { color: #fff; border-bottom: 1px solid #0f0; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>[+] Connexion au Labo Réussie !</h1>
    <p>Statut : Script en cours d'exécution sur le processeur de la Switch...</p>
    <hr>
    <div id="console"></div>

    <script>
        function log(msg) {
            document.getElementById('console').innerHTML += msg + "<br>";
        }

        try {
            log("<b>[✓] Navigateur détecté :</b> " + navigator.userAgent);
            log("<b>[✓] Plateforme matérielle :</b> " + navigator.platform);
            log("<b>[...] Tentative d'allocation mémoire basique...</b>");
            
            // Test d'allocation de mémoire pour observer le comportement du WebKit
            var buffer = new ArrayBuffer(1024 * 1024 * 4); // 4 Mo
            log("<b>[✓] Allocation réussie (4 Mo réservés).</b>");
            log("<br><span style='color:#00ffff;'>[!] Prêt pour l'étape suivante.</span>");
        } catch(e) {
            log("<span style='color:red;'>[X] Erreur détectée : " + e.message + "</span>");
        }
    </script>
</body>
</html>
