<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Labo Étape 5 : Stack Surcharge</title>
    <style>
        body { background: #111; color: #ff0000; font-family: monospace; padding: 20px; font-size: 16px; }
        h1 { color: #fff; border-bottom: 1px solid #ff0000; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>[+] Labo Étape 5 : Test de Surcharge de la Pile</h5>
    <p>Tentative de dépassement de capacité de la pile d'exécution...</p>
    <hr>
    <div id="console" style="color: #0f0;"></div>

    <script>
        function log(msg) {
            document.getElementById('console').innerHTML += msg + "<br>";
        }

        let prof = 2;

        // Fonction récursive qui s'appelle elle-même à l'infini
        function crashTest() {
            prof++;
            if (prof % 1000 === 0) {
                // On affiche la profondeur atteinte avant le blocage
                log("[.] Profondeur de la pile : " + prof);
            }
            crashTest(); // Appel récursif
        }

        try {
            log("[...] Lancement du test récursif...");
            crashTest();
        } catch(e) {
            // Si le navigateur attrape l'erreur proprement
            log("<br><span style='color:#ffff00;'>[!] Protection active : Le navigateur a stoppé la pile.</span>");
            log("Message du système : " + e.message);
        }
    </script>
</body>
</html>
