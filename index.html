<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Labo Étape 4 : Cartographie du Système</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; padding: 20px; font-size: 16px; }
        h1 { color: #fff; border-bottom: 1px solid #00ff00; padding-bottom: 10px; }
    </style>
</head>
<body>
    <h1>[+] Labo Étape 4 : Cartographie de l'environnement</h1>
    <p>Extraction des capacités et des objets système disponibles...</p>
    <hr>
    <div id="console"></div>

    <script>
        function log(msg) {
            document.getElementById('console').innerHTML += msg + "<br>";
        }

        try {
            log("[...] Analyse des fonctionnalités globales...");
            
            // Vérification de fonctionnalités souvent ciblées par les exploits
            log("Conteneur Math.gc (Garbage Collector) : " + (typeof Math.gc !== 'undefined' ? "Présent" : "Absent / Masqué"));
            log("Support des WebAssembly (Wasm) : " + (typeof WebAssembly !== 'undefined' ? "Disponible" : "Bloqué"));
            log("Support des SharedArrayBuffer : " + (typeof SharedArrayBuffer !== 'undefined' ? "Disponible" : "Désactivé"));
            
            log("<br>[...] Analyse des objets matériels accessibles :");
            log("Nombre de cœurs processeur visibles : " + (navigator.hardwareConcurrency || "Masqué"));
            log("Résolution d'écran logique : " + window.innerWidth + "x" + window.innerHeight);
            
            log("<br><span style='color:#00ffff;'>[✓] Cartographie terminée. Données d'environnement prêtes.</span>");
        } catch(e) {
            log("<span style='color:red;'>[X] Erreur d'inspection : " + e.message + "</span>");
        }
    </script>
</body>
</html>
